<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tab Session Outliner</title>
    <link rel="stylesheet" href="./sidebar.css" />
  </head>
  <body data-sidebar-booting>
    <header class="toolbar">
      <h1>Tabs</h1>
      <div class="search">
        <input
          id="search"
          class="search-input"
          type="search"
          aria-label="Search tabs"
          autocomplete="off"
          spellcheck="false"
        />
        <button
          id="clear-search"
          class="toolbar-button search-clear"
          type="button"
          title="Clear search"
          aria-label="Clear search"
          hidden
        >
          x
        </button>
      </div>
      <div class="status">
        <span id="state-count" class="count">Loading</span>
        <span id="diagnostics" class="diagnostics"></span>
      </div>
      <button id="undo-history" class="toolbar-button" type="button" title="Undo" aria-label="Undo" disabled>&#8630;</button>
      <button id="redo-history" class="toolbar-button" type="button" title="Redo" aria-label="Redo" disabled>&#8631;</button>
      <button id="export-tree" class="toolbar-button" type="button" title="Export tree" aria-label="Export tree">E</button>
      <button id="import-tree" class="toolbar-button" type="button" title="Import tree" aria-label="Import tree">I</button>
      <button id="refresh" class="toolbar-button" type="button" title="Refresh outline">R</button>
    </header>
    <input id="import-tree-file" type="file" accept="application/json,.json,.tree" hidden />
    <main>
      <p id="empty" class="empty" hidden>No tabs captured yet.</p>
      <ol id="tree" class="tree" aria-label="Tab outline"></ol>
    </main>
    <script type="module" src="./sidebar-boot.js"></script>
  </body>
</html>
