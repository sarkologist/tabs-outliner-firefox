<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tab Session Outliner</title>
    <link rel="stylesheet" href="./sidebar.css" />
  </head>
  <body data-sidebar-booting>
    <svg class="icon-sprite" aria-hidden="true" focusable="false">
      <symbol id="icon-chevron-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" /></symbol>
      <symbol id="icon-chevron-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" /></symbol>
      <symbol id="icon-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12" /></symbol>
      <symbol id="icon-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5" /><path d="M4 9h10a6 6 0 0 1 0 12h-2" /></symbol>
      <symbol id="icon-redo" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5" /><path d="M20 9H10a6 6 0 0 0 0 12h2" /></symbol>
      <symbol id="icon-export" viewBox="0 0 24 24"><path d="M12 3v12" /><path d="m7 8 5-5 5 5" /><path d="M5 15v4h14v-4" /></symbol>
      <symbol id="icon-import" viewBox="0 0 24 24"><path d="M12 2.5v12" /><path d="m7 9.5 5 5 5-5" /><path d="M5 15v4h14v-4" /></symbol>
      <symbol id="icon-refresh" viewBox="0 0 24 24"><path d="M20 6v5h-5" /><path d="M4 18v-5h5" /><path d="M18.5 9A7 7 0 0 0 6.3 6.8L4 9" /><path d="M5.5 15a7 7 0 0 0 12.2 2.2L20 15" /></symbol>
      <symbol id="icon-expand" viewBox="0 0 24 24"><path d="M8 3H3v5" /><path d="M3 3l7 7" /><path d="M16 21h5v-5" /><path d="m14 14 7 7" /></symbol>
      <symbol id="icon-gear" viewBox="0 0 24 24"><path d="M12 8.5a3.5 3.5 0 1 1 0 7a3.5 3.5 0 0 1 0-7Z" /><path d="m19 13.5 1.5 1-2 3.5-1.8-.8a7.3 7.3 0 0 1-1.5.9L15 20h-6l-.2-1.9a7.3 7.3 0 0 1-1.5-.9l-1.8.8-2-3.5 1.5-1a7.8 7.8 0 0 1 0-3l-1.5-1 2-3.5 1.8.8a7.3 7.3 0 0 1 1.5-.9L9 4h6l.2 1.9a7.3 7.3 0 0 1 1.5.9l1.8-.8 2 3.5-1.5 1a7.8 7.8 0 0 1 0 3Z" /></symbol>
      <symbol id="icon-scissors" viewBox="0 0 24 24"><circle cx="3.65" cy="7.93" r="2.45" /><circle cx="3.65" cy="16.07" r="2.45" /><path d="M5.86 9 12 12 19.82 15.81" /><path d="M5.86 15 12 12 19.82 8.19" /><circle cx="12" cy="12" r="0.85" fill="currentColor" stroke="none" /></symbol>
      <symbol id="icon-clipboard" viewBox="0 0 24 24"><path d="M9 4h6l1 2h3v15H5V6h3l1-2Z" /><path d="M9 4v4h6V4" /></symbol>
      <symbol id="icon-group" viewBox="0 0 24 24"><path d="M8.5 5c-1.8 0-1.8 1.6-1.8 2.8V10c0 .9-.8 1.8-1.7 1.8.9 0 1.7.9 1.7 1.8v2.2c0 1.2 0 2.8 1.8 2.8" /><path d="M11 8h7" /><path d="M11 12h7" /><path d="M11 16h7" /></symbol>
      <symbol id="icon-close-circle" viewBox="0 0 24 24"><path d="M18 6 6 18" /><path d="M6 6l12 12" /></symbol>
      <symbol id="icon-flatten" viewBox="0 0 24 24"><path d="M5 5v14" /><path d="M18 7v10" /><path d="M18 12H8" /><path d="m10 8-4 4 4 4" /></symbol>
      <symbol id="icon-outdent" viewBox="0 0 24 24"><path d="M14 6h6" /><path d="M10 12h10" /><path d="M14 18h6" /><path d="m9 8-4 4 4 4" /></symbol>
      <symbol id="icon-pencil" viewBox="0 0 24 24"><path d="m4 20 4.5-1 10-10a2.1 2.1 0 0 0-3-3l-10 10L4 20Z" /><path d="m13.5 7.5 3 3" /></symbol>
      <symbol id="icon-trash" viewBox="0 0 24 24"><path d="M4 7h16" /><path d="M9 7V4h6v3" /><path d="M6 7l1 14h10l1-14" /><path d="M10 11v6M14 11v6" /></symbol>
      <symbol id="icon-locate" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6" /><path d="M12 2v4M12 18v4M2 12h4M18 12h4" /><circle cx="12" cy="12" r="1" /></symbol>
    </svg>
    <header class="toolbar">
      <h1>Tabs</h1>
      <div class="search">
        <input
          id="search"
          class="search-input"
          type="search"
          aria-label="Search tabs"
          autocomplete="off"
          spellcheck="false"
        />
        <button
          id="clear-search"
          class="toolbar-button search-clear"
          type="button"
          title="Clear search"
          aria-label="Clear search"
          hidden
        >
          <svg class="toolbar-icon button-icon" aria-hidden="true"><use href="#icon-x"></use></svg>
        </button>
      </div>
      <div class="status">
        <span id="state-count" class="count">Loading</span>
        <span id="diagnostics" class="diagnostics"></span>
      </div>
      <button id="undo-history" class="toolbar-button" type="button" title="Undo" aria-label="Undo" disabled><svg class="toolbar-icon button-icon" aria-hidden="true"><use href="#icon-undo"></use></svg></button>
      <button id="redo-history" class="toolbar-button" type="button" title="Redo" aria-label="Redo" disabled><svg class="toolbar-icon button-icon" aria-hidden="true"><use href="#icon-redo"></use></svg></button>
      <button id="export-tree" class="toolbar-button" type="button" title="Export tree" aria-label="Export tree"><svg class="toolbar-icon button-icon" aria-hidden="true"><use href="#icon-export"></use></svg></button>
      <button id="import-tree" class="toolbar-button" type="button" title="Import tree" aria-label="Import tree"><svg class="toolbar-icon button-icon" aria-hidden="true"><use href="#icon-import"></use></svg></button>
      <button id="refresh" class="toolbar-button" type="button" title="Refresh outline" aria-label="Refresh outline"><svg class="toolbar-icon button-icon" aria-hidden="true"><use href="#icon-refresh"></use></svg></button>
      <button
        id="open-sidebar-window"
        class="toolbar-button"
        type="button"
        title="Open full-size sidebar"
        aria-label="Open full-size sidebar"
      >
        <svg class="toolbar-icon button-icon" aria-hidden="true"><use href="#icon-expand"></use></svg>
      </button>
      <button id="open-options" class="toolbar-button" type="button" title="Options" aria-label="Open options">
        <svg class="toolbar-icon button-icon" aria-hidden="true"><use href="#icon-gear"></use></svg>
      </button>
    </header>
    <input id="import-tree-file" type="file" accept="application/json,.json,.tree" hidden />
    <main>
      <p id="empty" class="empty" hidden>No tabs captured yet.</p>
      <ol id="tree" class="tree" aria-label="Tab outline"></ol>
    </main>
    <script type="module" src="./sidebar-boot.js"></script>
  </body>
</html>
