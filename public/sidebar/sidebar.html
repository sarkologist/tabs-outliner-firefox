<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tab Session Outliner</title>
    <link rel="stylesheet" href="./sidebar.css" />
  </head>
  <body>
    <header class="toolbar">
      <h1>Tabs</h1>
      <div class="status">
        <span id="state-count" class="count">Loading</span>
        <span id="diagnostics" class="diagnostics"></span>
      </div>
    </header>
    <main>
      <p id="empty" class="empty" hidden>No tabs captured yet.</p>
      <ol id="tree" class="tree" aria-label="Tab outline"></ol>
    </main>
    <script type="module" src="./sidebar.js"></script>
  </body>
</html>
