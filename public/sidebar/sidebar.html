<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tab Session Outliner</title>
    <link rel="stylesheet" href="./sidebar.css" />
  </head>
  <body data-sidebar-booting>
    <header class="toolbar">
      <h1>Tabs</h1>
      <div class="search">
        <input
          id="search"
          class="search-input"
          type="search"
          aria-label="Search tabs"
          autocomplete="off"
          spellcheck="false"
        />
        <button
          id="clear-search"
          class="toolbar-button search-clear"
          type="button"
          title="Clear search"
          aria-label="Clear search"
          hidden
        >
          x
        </button>
      </div>
      <div class="status">
        <span id="state-count" class="count">Loading</span>
        <span id="diagnostics" class="diagnostics"></span>
      </div>
      <button id="undo-history" class="toolbar-button" type="button" title="Undo" aria-label="Undo" disabled>&#8630;</button>
      <button id="redo-history" class="toolbar-button" type="button" title="Redo" aria-label="Redo" disabled>&#8631;</button>
      <button id="export-tree" class="toolbar-button" type="button" title="Export tree" aria-label="Export tree">E</button>
      <button id="import-tree" class="toolbar-button" type="button" title="Import tree" aria-label="Import tree">I</button>
      <button id="refresh" class="toolbar-button" type="button" title="Refresh outline">R</button>
      <button
        id="open-sidebar-window"
        class="toolbar-button"
        type="button"
        title="Open full-size sidebar"
        aria-label="Open full-size sidebar"
      >
        M
      </button>
      <button id="open-options" class="toolbar-button" type="button" title="Options" aria-label="Open options">
        <svg class="toolbar-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M12 8.4a3.6 3.6 0 1 1 0 7.2a3.6 3.6 0 0 1 0-7.2Zm8.1 4.7v-2.2l-2.1-.4a6.7 6.7 0 0 0-.7-1.7l1.2-1.8L17 5.5l-1.8 1.2a6.7 6.7 0 0 0-1.7-.7L13.1 4h-2.2l-.4 2.1a6.7 6.7 0 0 0-1.7.7L7 5.5L5.5 7l1.2 1.8a6.7 6.7 0 0 0-.7 1.7l-2 .4v2.2l2 .4c.2.6.4 1.2.7 1.7L5.5 17L7 18.5l1.8-1.2c.5.3 1.1.6 1.7.7l.4 2.1h2.2l.4-2.1c.6-.2 1.2-.4 1.7-.7l1.8 1.2l1.5-1.5l-1.2-1.8c.3-.5.6-1.1.7-1.7l2.1-.4Z"
          />
        </svg>
      </button>
    </header>
    <input id="import-tree-file" type="file" accept="application/json,.json,.tree" hidden />
    <main>
      <p id="empty" class="empty" hidden>No tabs captured yet.</p>
      <ol id="tree" class="tree" aria-label="Tab outline"></ol>
    </main>
    <script type="module" src="./sidebar-boot.js"></script>
  </body>
</html>
