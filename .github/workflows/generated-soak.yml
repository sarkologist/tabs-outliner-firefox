name: Generated Trace Soak

on:
  workflow_dispatch:
    inputs:
      seed:
        description: Base seed to replay. Leave blank to choose one randomly.
        required: false
        type: string
      seed_count:
        description: Number of consecutive seeds to run.
        required: false
        type: string
      steps:
        description: Steps or cycles per generated trace.
        required: false
        type: string
  schedule:
    - cron: "17 3 * * *"

jobs:
  soak:
    name: Generated trace soak
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run generated trace soak
        run: pnpm test:soak
        env:
          SOAK_SEED: ${{ github.event.inputs.seed }}
          SOAK_SEED_COUNT: ${{ github.event.inputs.seed_count }}
          SOAK_STEPS: ${{ github.event.inputs.steps }}
