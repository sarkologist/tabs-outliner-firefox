name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  check:
    name: Unit, build, and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run unit tests and build
        run: pnpm run check

      - name: Run Playwright behavior tests
        run: pnpm run test:playwright:ci

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            test-results/playwright
            playwright-report
          if-no-files-found: ignore

  runtime-perf-hard-counters:
    # Enforces the runtime perf guard's hard counters (saves, journalWrites,
    # storageSetCalls, byte and broadcast counts) on every PR. Timing budgets are
    # machine-variance-sensitive on shared runners, so they are report-only here and
    # remain a blocking local pre-commit gate (AGENTS.md; docs/storage-rearchitecture
    # 03-WORKFLOW-FIXES W-1).
    name: Runtime perf guard (hard counters)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Run runtime perf guard (hard counters only)
        run: node scripts/perf-runtime-guard.mjs --hard-only
